name: pr-test-build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          mkdir -p dist
          go build -o dist/CLIProxyAPI-linux-amd64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -o dist/CLIProxyAPI-windows-amd64.exe ./cmd/server
      - name: Upload Linux artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyAPI-linux-amd64
          path: dist/CLIProxyAPI-linux-amd64
          if-no-files-found: error
      - name: Upload Windows artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyAPI-windows-amd64
          path: dist/CLIProxyAPI-windows-amd64.exe
          if-no-files-found: error
